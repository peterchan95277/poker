<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德州撲克勝率計算機</title>
<!-- PWA 核心：連結到 Manifest 檔案 (請確保 manifest.json 也在根目錄) -->
<link rel="manifest" href="manifest.json">
<!-- 載入 Tailwind CSS (這是關鍵：確保這個網址正確) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- 載入 Inter 字體 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 使用 Inter 字體 */
body {
font-family: 'Inter', sans-serif;
background-color: #f7f7f7;
}
/* 讓下拉選單中的花色有顏色 */
.card-select option.red-suit { color: #ef4444; /* 紅色 */ }
.card-select option.black-suit { color: #1f2937; /* 深灰 */ }
.card-select option:disabled { background-color: #e5e7eb; color: #9ca3af; }
</style>
</head>
<body class="p-4 sm:p-8 min-h-screen bg-gray-900 text-white">

<div class="max-w-4xl mx-auto">
    <header class="text-center mb-10">
        <h1 class="text-3xl sm:text-4xl font-bold text-yellow-400">德州撲克勝率計算機</h1>
        <p class="text-gray-400 mt-2">使用 Monte Carlo 模擬計算您的手牌勝率</p>
    </header>

    <!-- 卡牌輸入區塊 -->
    <div id="input-section" class="bg-gray-800 p-6 rounded-xl shadow-2xl mb-8">
        <h2 class="text-xl font-semibold mb-4 text-gray-200">選取牌局資訊 (下拉選單模式)</h2>
        <p id="picker-status" class="text-center text-sm font-semibold p-2 rounded bg-gray-700 text-yellow-300 transition duration-300">
            請從下拉選單中選取牌局中所有已知的牌。
        </p>
        
        <!-- 總玩家人數選項 -->
        <div class="mt-4 p-4 bg-gray-700 rounded-lg">
            <label class="block text-lg font-medium text-gray-200 mb-2">總玩家人數 (包括您)</label>
            <select id="num-players" class="w-full p-2 bg-white text-gray-900 rounded-md border border-gray-300 shadow-sm text-base focus:ring-yellow-500 focus:border-yellow-500">
                <option value="2">2 (單挑)</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9 (滿桌)</option>
            </select>
        </div>

        <!-- 玩家手牌 1 -->
        <div class="p-4 bg-gray-700 rounded-lg mt-4 selection-target" id="p1-selector">
            <label class="block text-lg font-medium text-blue-300 mb-2">玩家 1 手牌 (您的手牌，2 張)</label>
            <div id="p1-display" class="card-display-area min-h-[50px] flex flex-wrap items-center gap-2 p-2 bg-gray-900 rounded border-2 border-transparent">
                <!-- Dropdowns are dynamically inserted here -->
            </div>
        </div>

        <!-- 玩家手牌 2 (可選的已知對手) -->
        <div class="p-4 bg-gray-700 rounded-lg mt-4 selection-target" id="p2-selector">
            <label class="block text-lg font-medium text-red-300 mb-2">玩家 2 手牌 (已知對手，0 或 2 張，選填)</label>
            <div id="p2-display" class="card-display-area min-h-[50px] flex flex-wrap items-center gap-2 p-2 bg-gray-900 rounded border-2 border-transparent">
                <!-- Dropdowns are dynamically inserted here -->
            </div>
        </div>

        <!-- 公共牌 -->
        <div class="mt-6 p-4 bg-gray-700 rounded-lg selection-target" id="board-selector">
            <label class="block text-lg font-medium text-gray-200 mb-2">公共牌 (Flop, Turn, River，0-5 張)</label>
            <div id="board-display" class="card-display-area min-h-[50px] flex flex-wrap items-center gap-2 p-2 bg-gray-900 rounded border-2 border-transparent">
                <!-- Dropdowns are dynamically inserted here -->
            </div>
        </div>
        
        <!-- 計算按鈕 -->
        <button id="calculate-btn" class="w-full mt-8 py-3 px-6 bg-green-600 hover:bg-green-700 text-white font-bold text-xl rounded-lg shadow-lg transform transition duration-150 hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-green-500/50">
            計算勝率
        </button>
    </div>

    <!-- 結果顯示區塊 -->
    <div id="results-section" class="bg-gray-800 p-6 rounded-xl shadow-2xl">
        <h2 class="text-xl font-semibold text-gray-200 mb-4">計算結果 (Monte Carlo 模擬 10,000 次)</h2>
        <div id="loading-spinner" class="text-center hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500 mx-auto"></div>
            <p class="mt-3 text-yellow-400">正在模擬牌局...</p>
        </div>
        
        <div id="results-display" class="hidden">
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="p-4 bg-gray-900 rounded-lg border-b-4 border-green-500">
                    <p class="text-3xl font-bold text-green-400" id="win-rate">0.00%</p>
                    <p class="text-sm text-gray-400 mt-1">勝率 (Player 1)</p>
                </div>
                <div class="p-4 bg-gray-900 rounded-lg border-b-4 border-yellow-500">
                    <p class="text-3xl font-bold text-yellow-300" id="tie-rate">0.00%</p>
                    <p class="text-sm text-gray-400 mt-1">和局率</p>
                </div>
                <div class="p-4 bg-gray-900 rounded-lg border-b-4 border-red-500">
                    <p class="text-3xl font-bold text-red-400" id="loss-rate">0.00%</p>
                    <p class="text-sm text-gray-400 mt-1">敗率 (Player 1)</p>
                </div>
            </div>
        </div>

        <div id="error-message" class="hidden mt-4 p-4 bg-red-800 rounded-lg text-red-200">
            <!-- 錯誤訊息將顯示在這裡 -->
        </div>
    </div>
</div>

<script>
    // PWA Service Worker 註冊 (請確保 service-worker.js 和 manifest.json 存在)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Service Worker 註冊成功:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker 註冊失敗:', error);
          });
      });
    }
    
    // --- 全局常數與元素 ---
    const RANKS = '23456789TJQKA';
    const SUITS = 'shdc';
    const NUM_ITERATIONS = 10000;

    const resultsDisplay = document.getElementById('results-display');
    const loadingSpinner = document.getElementById('loading-spinner');
    const calculateBtn = document.getElementById('calculate-btn');
    const winRateEl = document.getElementById('win-rate');
    const tieRateEl = document.getElementById('tie-rate');
    const lossRateEl = document.getElementById('loss-rate');
    const errorMsgEl = document.getElementById('error-message');
    const pickerStatusEl = document.getElementById('picker-status');

    // 輸入顯示區塊
    const p1DisplayEl = document.getElementById('p1-display');
    const p2DisplayEl = document.getElementById('p2-display');
    const boardDisplayEl = document.getElementById('board-display');
    const numPlayersEl = document.getElementById('num-players'); // 總玩家人數元素

    // --- 狀態管理：使用卡牌字串陣列來儲存選取狀態 ---
    let player1CardStrs = ['', '']; // 玩家 1 的兩張牌 (必填)
    let player2CardStrs = ['', '']; // 玩家 2 的兩張牌 (選填)
    let boardCardStrs = ['', '', '', '', '']; // 公共牌最多五張

    // 卡牌字串與花色符號的映射
    const SUIT_SYMBOLS = { 's': '♠', 'h': '♥', 'd': '♦', 'c': '♣' };

    // --- 輔助函數：卡牌處理與驗證 ---

    /**
     * 將卡牌字串 (例如 'As') 轉換為物件 { rank: 14, suit: 's', str: 'AS' }
     * @param {string} cardStr - 卡牌字串
     * @returns {{rank: number, suit: string, str: string} | null} - 卡牌物件或 null (如果無效)
     */
    function parseCard(cardStr) {
        if (cardStr.length !== 2) return null;
        const rankStr = cardStr[0].toUpperCase();
        const suit = cardStr[1].toLowerCase();
        const rankIndex = RANKS.indexOf(rankStr);

        if (rankIndex === -1 || SUITS.indexOf(suit) === -1) return null;

        // 撲克牌等級 (A=14, K=13, ..., 2=2)
        const rank = rankIndex + 2; 

        return { rank, suit, str: cardStr.toUpperCase() };
    }

    /**
     * 建立一副完整的卡牌
     * @returns {Array<{rank: number, suit: string, str: string}>} - 完整的牌組
     */
    function createDeck() {
        const deck = [];
        for (const suit of SUITS) {
            for (let i = 0; i < RANKS.length; i++) {
                const rankStr = RANKS[i];
                const rank = i + 2;
                deck.push({ rank, suit, str: (rankStr + suit).toUpperCase() });
            }
        }
        return deck;
    }

    /**
     * 獲取所有當前已被選取的卡牌字串
     */
    function getAllSelectedCardStrs() {
        return [...player1CardStrs, ...player2CardStrs, ...boardCardStrs].filter(s => s !== '');
    }


    // --- UI 渲染與互動邏輯 (Dropdowns) ---

    /**
     * 獲取所有 52 張卡牌的選項 HTML
     * @returns {Array<string>} 包含所有卡牌字串的陣列 (例如 'AS', 'KH', '3D', ...)
     */
    function getFullDeckCardStrs() {
        const deck = createDeck();
        return deck.map(c => c.str);
    }

    /**
     * 生成單一卡牌下拉選單的 HTML
     * @param {string} slotId - 欄位 ID (例如 'p1-0', 'board-3')
     * @param {string} currentValue - 當前選中的卡牌字串
     * @param {string[]} allSelected - 所有已被選取的卡牌字串
     * @param {boolean} allowEmpty - 是否允許 "-- (空牌) --" 選項
     * @returns {string} HTML <select> 標籤
     */
    function generateCardSelectHtml(slotId, currentValue, allSelected, allowEmpty) {
        const cardStrs = getFullDeckCardStrs();
        let optionsHtml = '';
        
        // 預設選項：空牌
        if (allowEmpty || currentValue === '') {
             optionsHtml += `<option value="" ${currentValue === '' ? 'selected' : ''}>-- (空牌) --</option>`;
        }

        cardStrs.forEach(cardStr => {
            const isSelectedByOthers = allSelected.includes(cardStr) && cardStr !== currentValue;
            const isRed = cardStr[1].toLowerCase() === 'h' || cardStr[1].toLowerCase() === 'd';
            const suitSymbol = SUIT_SYMBOLS[cardStr[1].toLowerCase()];
            const colorClass = isRed ? 'red-suit' : 'black-suit';
            
            // 如果被其他地方選中，則禁用
            const disabledAttr = isSelectedByOthers ? 'disabled' : '';
            
            // 顯示為 Rank + Suit Symbol
            const optionText = `${cardStr[0]} ${suitSymbol}`;
            
            optionsHtml += `
                <option 
                    value="${cardStr}" 
                    ${currentValue === cardStr ? 'selected' : ''} 
                    ${disabledAttr} 
                    class="${colorClass}"
                >
                    ${optionText}
                </option>
            `;
        });

        // 確保 onchange 呼叫一個全局可用的函數
        return `
            <select 
                id="${slotId}" 
                data-slot-id="${slotId}"
                class="card-select w-full p-2 bg-white text-gray-900 rounded-md border border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 text-base"
                onchange="handleDropdownChange(this)"
            >
                ${optionsHtml}
            </select>
        `;
    }
    
    // 將 handleDropdownChange 定義為全局函數
    window.handleDropdownChange = function(selectElement) {
        const slotId = selectElement.getAttribute('data-slot-id');
        const newValue = selectElement.value; // Card string or ''
        const [target, indexStr] = slotId.split('-');
        const index = parseInt(indexStr);

        switch (target) {
            case 'p1':
                player1CardStrs[index] = newValue;
                break;
            case 'p2':
                player2CardStrs[index] = newValue;
                break;
            case 'board':
                // 如果用戶在 Flop/Turn/River 選了空牌，則清空後面的所有牌
                if (newValue === '') {
                    for (let i = index + 1; i < 5; i++) {
                        boardCardStrs[i] = '';
                    }
                }
                boardCardStrs[index] = newValue;
                break;
        }

        // 重新渲染所有下拉選單，以更新禁用狀態和公共牌的插槽數量
        renderAllDropdowns();
    }


    /**
     * 渲染所有下拉選單
     */
    function renderAllDropdowns() {
        const allSelected = getAllSelectedCardStrs();
        
        errorMsgEl.classList.add('hidden');

        // --- 玩家 1 (必填) ---
        const p1Html = player1CardStrs.map((cardStr, index) => `
            <div class="w-1/2 p-1">
                <label class="block text-xs font-medium text-gray-400 mb-1">牌 ${index + 1}</label>
                ${generateCardSelectHtml(`p1-${index}`, cardStr, allSelected, false)}
            </div>
        `).join('');
        p1DisplayEl.innerHTML = `<div class="flex">${p1Html}</div>`;
        
        // --- 玩家 2 (選填) ---
        const p2Html = player2CardStrs.map((cardStr, index) => `
            <div class="w-1/2 p-1">
                <label class="block text-xs font-medium text-gray-400 mb-1">牌 ${index + 1}</label>
                ${generateCardSelectHtml(`p2-${index}`, cardStr, allSelected, true)}
            </div>
        `).join('');
        p2DisplayEl.innerHTML = `<div class="flex">${p2Html}</div>`;

        // --- 公共牌 ---
        const boardSlotTitles = ['Flop 1', 'Flop 2', 'Flop 3', 'Turn', 'River'];
        const currentBoardLength = boardCardStrs.filter(s => s !== '').length;
        
        let finalBoardHtml = '';
        
        // 固定渲染 5 個插槽，但只允許選取到「當前已選的下一張」
        for (let index = 0; index < 5; index++) {
            const cardStr = boardCardStrs[index];
            // 允許選擇已選的牌和下一個空位 (實現連續選牌)
            const allowSelect = index <= currentBoardLength; 
            
            if (allowSelect) {
                 // 只有第一個插槽在空牌時使用 "-- (空牌) --"，其他後續插槽若允許選取，則必須選牌或清空前一格
                 const allowEmptyOption = index === 0 || cardStr === '';
                 
                 finalBoardHtml += `
                    <div class="w-1/5 p-1 min-w-[70px]">
                        <label class="block text-xs font-medium text-gray-400 mb-1">${boardSlotTitles[index]}</label>
                        ${generateCardSelectHtml(`board-${index}`, cardStr, allSelected, allowEmptyOption)}
                    </div>
                `;
            }
        }
        
        boardDisplayEl.innerHTML = `<div class="flex flex-wrap">${finalBoardHtml}</div>`;
    }
    
    // --- 撲克牌手牌評估核心邏輯 ---
    const HAND_RANKS = {
        STRAIGHT_FLUSH: 9, FOUR_OF_A_KIND: 8, FULL_HOUSE: 7, FLUSH: 6, STRAIGHT: 5, 
        THREE_OF_A_KIND: 4, TWO_PAIR: 3, ONE_PAIR: 2, HIGH_CARD: 1
    };

    /**
     * 從 7 張牌中找出最好的 5 張牌組合，並返回其等級和踢牌 (Kickers)
     * @param {Array<{rank: number, suit: string, str: string}>} sevenCards - 7 張卡牌物件
     * @returns {{rank: number, kickers: number[]}} - 牌型結果
     */
    function getBestFiveCardHand(sevenCards) {
        // 1. 準備數據：排序後的牌階、牌階計數
        const sortedRanks = sevenCards.map(c => c.rank).sort((a, b) => b - a);
        const rankCounts = sortedRanks.reduce((acc, rank) => {
            acc[rank] = (acc[rank] || 0) + 1;
            return acc;
        }, {});
        
        // 按數量和牌階降序排列的計數列表
        const counts = Object.entries(rankCounts).map(([rank, count]) => ({ rank: parseInt(rank), count })).sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return b.rank - a.rank;
        });

        // 2. 順子檢查
        const uniqueRanks = Array.from(new Set(sortedRanks));
        // 處理 A-5 順子 (A=14，但順子時 A=1)
        if (uniqueRanks.includes(14)) uniqueRanks.push(1);
        uniqueRanks.sort((a, b) => b - a);
        
        let straightHigh = 0;
        for (let i = 0; i <= uniqueRanks.length - 5; i++) {
            if (uniqueRanks[i] === uniqueRanks[i + 4] + 4) {
                straightHigh = uniqueRanks[i];
                break;
            }
        }
        const isStraight = straightHigh > 0;

        // 3. 同花檢查
        const suitCounts = sevenCards.reduce((acc, c) => {
            acc[c.suit] = acc[c.suit] || [];
            acc[c.suit].push(c.rank);
            return acc;
        }, {});
        let flushSuit = null;
        let flushRanks = [];
        for (const suit of SUITS) {
            if (suitCounts[suit] && suitCounts[suit].length >= 5) {
                flushSuit = suit;
                // 取出同花中的最高 5 張牌
                flushRanks = suitCounts[suit].sort((a, b) => b - a).slice(0, 5);
                break;
            }
        }
        const isFlush = flushSuit !== null;

        // 4. 判斷牌型 (從最強到最弱)
        
        // 4.1 皇家同花順 / 同花順
        if (isFlush) {
            const flushUniqueRanks = Array.from(new Set(flushRanks));
            if (flushUniqueRanks.includes(14)) flushUniqueRanks.push(1);
            flushUniqueRanks.sort((a, b) => b - a);
            
            let straightFlushHigh = 0;
            for (let i = 0; i <= flushUniqueRanks.length - 5; i++) {
                if (flushUniqueRanks[i] === flushUniqueRanks[i + 4] + 4) {
                    straightFlushHigh = flushUniqueRanks[i];
                    return { rank: HAND_RANKS.STRAIGHT_FLUSH, kickers: [straightFlushHigh] };
                }
            }
        }

        // 4.2 四條
        if (counts[0] && counts[0].count === 4) {
            const quadRank = counts[0].rank;
            const kicker = sortedRanks.find(r => r !== quadRank);
            return { rank: HAND_RANKS.FOUR_OF_A_KIND, kickers: [quadRank, kicker || 0] };
        }

        // 4.3 滿堂紅 (葫蘆)
        if (counts[0] && counts[0].count >= 3 && counts[1] && counts[1].count >= 2) {
            return { rank: HAND_RANKS.FULL_HOUSE, kickers: [counts[0].rank, counts[1].rank] };
        }

        // 4.4 同花
        if (isFlush) {
            return { rank: HAND_RANKS.FLUSH, kickers: flushRanks };
        }

        // 4.5 順子
        if (isStraight) {
            return { rank: HAND_RANKS.STRAIGHT, kickers: [straightHigh] };
        }

        // 4.6 三條
        if (counts[0] && counts[0].count === 3) {
            const threeRank = counts[0].rank;
            const kickers = sortedRanks.filter(r => r !== threeRank).slice(0, 2);
            return { rank: HAND_RANKS.THREE_OF_A_KIND, kickers: [threeRank, ...kickers] };
        }

        // 4.7 兩對
        if (counts[0] && counts[0].count === 2 && counts[1] && counts[1].count === 2) {
            const pair1Rank = counts[0].rank;
            const pair2Rank = counts[1].rank;
            const kicker = sortedRanks.find(r => r !== pair1Rank && r !== pair2Rank);
            return { rank: HAND_RANKS.TWO_PAIR, kickers: [pair1Rank, pair2Rank, kicker || 0] };
        }

        // 4.8 一對
        if (counts[0] && counts[0].count === 2) {
            const pairRank = counts[0].rank;
            const kickers = sortedRanks.filter(r => r !== pairRank).slice(0, 3);
            return { rank: HAND_RANKS.ONE_PAIR, kickers: [pairRank, ...kickers] };
        }

        // 4.9 高牌
        return { rank: HAND_RANKS.HIGH_CARD, kickers: sortedRanks.slice(0, 5) };
    }

    /**
     * 比較兩手牌的評估結果
     * @returns {number} - 1 (Hand 1 勝), -1 (Hand 2 勝), 0 (和局)
     */
    function compareHands(hand1, hand2) {
        if (hand1.rank !== hand2.rank) {
            return hand1.rank > hand2.rank ? 1 : -1;
        }
        for (let i = 0; i < hand1.kickers.length; i++) {
            if (hand1.kickers[i] !== hand2.kickers[i]) {
                return hand1.kickers[i] > hand2.kickers[i] ? 1 : -1;
            }
        }
        return 0;
    }

    // --- Monte Carlo 模擬主函數 ---

    /**
     * 執行 Monte Carlo 模擬並計算勝率
     */
    async function calculateEquity() {
        // 1. 重設 UI 和錯誤訊息
        errorMsgEl.classList.add('hidden');
        resultsDisplay.classList.add('hidden');
        loadingSpinner.classList.remove('hidden');

        const numPlayers = parseInt(numPlayersEl.value);
        const p1Cards = player1CardStrs.filter(s => s !== '').map(parseCard);
        const rawBoardCards = boardCardStrs;
        const p2CardsProvided = player2CardStrs.filter(s => s !== '').length === 2;

        try {
            // 2. 驗證輸入數量
            if (p1Cards.length !== 2) {
                throw new Error('玩家 1 必須剛好選取 2 張手牌。');
            }
            if (player2CardStrs.filter(s => s !== '').length === 1) {
                throw new Error('玩家 2 的手牌必須是 2 張或 0 張。');
            }

            // 檢查板牌是否連續
            let boardCards = [];
            let hasEmptySlot = false;
            for(const cardStr of rawBoardCards) {
                if (cardStr === '') {
                    hasEmptySlot = true;
                } else if (hasEmptySlot) {
                    throw new Error('公共牌不能有中間的空牌插槽。請確保按順序選牌。');
                } else {
                    boardCards.push(parseCard(cardStr));
                }
            }
            
            // 3. 確定對手數量和類型
            let knownOpponentHands = [];
            if (p2CardsProvided) {
                knownOpponentHands.push(player2CardStrs.filter(s => s !== '').map(parseCard));
            }

            // 總對手數 = 總玩家數 - 1 (P1)
            const totalOpponents = numPlayers - 1; 
            // 未知對手數 = 總對手數 - 已知對手數 (P2)
            const unknownOpponentCount = totalOpponents - knownOpponentHands.length; 
            
            if (unknownOpponentCount < 0) {
                throw new Error('總玩家人數少於已輸入的玩家手牌數量。');
            }
            
            // 4. 檢查重複卡牌
            const knownCardStrs = getAllSelectedCardStrs();
            const uniqueCardStrs = new Set(knownCardStrs);
            if (uniqueCardStrs.size !== knownCardStrs.length) {
                throw new Error('輸入卡牌中存在重複的牌。請檢查您的選取。');
            }
            
            // 5. 建立未知牌組 (Deck)
            const deck = createDeck();
            const usedCardStrs = new Set(knownCardStrs);
            const unknownDeck = deck.filter(card => !usedCardStrs.has(card.str.toUpperCase()));
            
            // 確保牌組足夠
            const requiredCards = (2 * unknownOpponentCount) + (5 - boardCards.length);
            if (unknownDeck.length < requiredCards) {
                throw new Error(`牌組中剩餘的牌 (${unknownDeck.length}) 不足以模擬所有未知手牌和公共牌 (${requiredCards})。請檢查輸入是否過多或玩家數設置錯誤。`);
            }

            // 6. 執行模擬
            let wins = 0;
            let ties = 0;
            let losses = 0;

            const cardsNeededOnBoard = 5 - boardCards.length;
            
            await new Promise(resolve => setTimeout(resolve, 10)); // 讓 UI 有時間更新

            for (let i = 0; i < NUM_ITERATIONS; i++) {
                let availableCards = [...unknownDeck];
                
                // 簡單的洗牌 (Fisher-Yates)
                for (let j = availableCards.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [availableCards[j], availableCards[k]] = [availableCards[k], availableCards[j]];
                }
                
                // 發出剩餘的公共牌
                const dealtBoardCards = availableCards.splice(0, cardsNeededOnBoard);
                const finalBoard = [...boardCards, ...dealtBoardCards];

                // 發出所有未知對手的手牌
                let dealtOpponentHands = [];
                for (let j = 0; j < unknownOpponentCount; j++) {
                    // 每手牌 2 張
                    dealtOpponentHands.push(availableCards.splice(0, 2));
                }

                // 合併所有對手的手牌 (已知 + 未知)
                const allOpponentHands = [...knownOpponentHands, ...dealtOpponentHands];

                // 比較 P1 對抗所有對手
                const p1SevenCards = [...p1Cards, ...finalBoard];
                const p1HandRank = getBestFiveCardHand(p1SevenCards);
                
                let bestOpponentRank = null;
                
                // 找出所有對手中最強的一手牌 (只有最強對手才能阻止 P1 獲勝)
                for (const opponentHand of allOpponentHands) {
                    const opponentSevenCards = [...opponentHand, ...finalBoard];
                    const opponentHandRank = getBestFiveCardHand(opponentSevenCards);

                    if (bestOpponentRank === null) {
                        bestOpponentRank = opponentHandRank;
                    } else {
                        const comparison = compareHands(opponentHandRank, bestOpponentRank);
                        if (comparison === 1) {
                            // 發現更強的對手
                            bestOpponentRank = opponentHandRank;
                        }
                        // 如果 comparison === 0 (平手)，則維持現有的 bestOpponentRank
                    }
                }

                if (bestOpponentRank === null) {
                    // 這只會在 totalOpponents = 0 時發生，但我們驗證了 totalOpponents >= 1
                    wins++; 
                } else {
                    const finalResult = compareHands(p1HandRank, bestOpponentRank);
                    
                    if (finalResult === 1) {
                        wins++; // P1 嚴格擊敗最強對手
                    } else if (finalResult === 0) {
                        // P1 與最強對手平手。在多對手情況下，P1 分享彩池
                        ties++; 
                    } else {
                        losses++; // P1 輸給最強對手
                    }
                }
            }
            
            // 7. 顯示結果
            const total = wins + ties + losses;
            const winRate = (wins / total * 100).toFixed(2);
            const tieRate = (ties / total * 100).toFixed(2);
            const lossRate = (losses / total * 100).toFixed(2);

            winRateEl.textContent = `${winRate}%`;
            tieRateEl.textContent = `${tieRate}%`;
            lossRateEl.textContent = `${lossRate}%`;

            loadingSpinner.classList.add('hidden');
            resultsDisplay.classList.remove('hidden');

        } catch (error) {
            loadingSpinner.classList.add('hidden');
            errorMsgEl.textContent = `錯誤：${error.message}`;
            errorMsgEl.classList.remove('hidden');
        }
    }

    // --- 事件監聽器和初始化 ---

    document.addEventListener('DOMContentLoaded', () => {
         resultsDisplay.classList.add('hidden');
         calculateBtn.addEventListener('click', calculateEquity);
         
         // 初始化時渲染所有下拉選單
         renderAllDropdowns();
         
         // 確保在人數變動時，牌局顯示正確 (儘管邏輯上只有渲染會改變)
         numPlayersEl.addEventListener('change', renderAllDropdowns);
    });

</script>
